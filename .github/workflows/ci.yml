name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support"
          --health-interval 5s
          --health-retries 10

    # No OpenAI key here on purpose: tests swap the model for a scripted one,
    # and the evals that do call the API are run by hand.
    env:
      DATABASE_URL: postgresql://support:support@localhost:5432/support

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.23"

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/seed_db.py
      - run: uv run pytest
