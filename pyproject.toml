[project]
name = "support-agent"
version = "0.1.0"
description = "Customer support chatbot for a small bike shop, built with LangGraph and RAG on Postgres"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.41.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Postgres container running"]
